<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlenraten</title>
    <link rel="stylesheet" href="zahlenraten.css">
</head>
<body>
    <!-- Main container for the game -->
    <div class="container">
        <h1>Zahlenraten</h1>
        <p>...von 1 bis 100</p>

        <!-- Input field for user's guess -->
        <input type="number" id="guess" placeholder="Deine Vermutung" min="1" max="100">
        <!-- Button to submit a guess -->
        <button id="check_button">Prüfen</button>
        <!-- Button to restart the game -->
        <button id="restart_button">Neu starten</button>
        <!-- Display for number of attempts -->
        <p>Versuche: <span id="versuche">0</span></p>
        <!-- Display for game messages (too high, too low, correct) -->
        <p id="message">Viel Glück!</p>
    </div>

    <script src="zahlenraten.js"></script>
</body>
</html>
