<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schach</title>
  <link rel="stylesheet" href="css/chess.css" />
</head>
<body>

  <!-- Haupt-Container -->
  <div id="app">

    <!-- Spielinfo (Spieler, Timer, etc.) -->
    <div id="info-panel">
      <span id="current-player">Am Zug: Weiß</span>
    </div>

    <!-- Das Schachbrett -->
    <div id="board">
      <!-- 64 Felder werden per board.js dynamisch erzeugt -->
    </div>

    <!-- Geschlagene Figuren -->
    <div id="captured-pieces">
      <div id="captured-white"></div>
      <div id="captured-black"></div>
    </div>

  </div>

  <!-- JS-Dateien in der richtigen Reihenfolge laden -->
  <script src="js/pieces.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
