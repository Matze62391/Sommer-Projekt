<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- Sorgt dafür, dass die Seite auf Handy/Tablet korrekt skaliert -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TicTacTo Ultra</title>

    <!-- Verknüpft die externe CSS-Datei für das Design -->
    <link rel="stylesheet" href="TicTacTo_Ultra.css">
</head>

<body>

    <div class="container">
        <!-- Hauptüberschrift des Spiels -->
        <h1>Tic Tac To</h1>

        <div class="game-board">

            <!-- Classic TicTacToe Spielfeld -->
            <div class="classic">

                <!-- 9 Felder des Classic-Boards -->
                <!-- Jedes Feld hat die Klasse "cell_c" und eine eindeutige ID -->
                <div class="cell_c" id="classic-0"></div>
                <div class="cell_c" id="classic-1"></div>
                <div class="cell_c" id="classic-2"></div>
                <div class="cell_c" id="classic-3"></div>
                <div class="cell_c" id="classic-4"></div>
                <div class="cell_c" id="classic-5"></div>
                <div class="cell_c" id="classic-6"></div>
                <div class="cell_c" id="classic-7"></div>
                <div class="cell_c" id="classic-8"></div>

            </div>

            <!-- Reset-Button zum Zurücksetzen des Spiels -->
            <button id="reset-button">Reset</button>

        </div>
    </div>

    <!-- Verknüpft die JavaScript-Datei, die die Spiellogik enthält -->
    <script src="TicTacTo_Ultra.js"></script>
</body>

</html>
